services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      # Persistir evidence.jsonl fuera del contenedor — si el contenedor se
      # recrea, la evidencia no debería desaparecer con él.
      - ./backend/data:/app/backend/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Esta URL la usa el NAVEGADOR del usuario, no la red interna de
        # Docker — por eso es localhost:8000 (el puerto publicado del
        # backend en el host), no "http://backend:8000".
        VITE_API_BASE_URL: "http://localhost:8000/api"
    ports:
      - "8080:80"
    depends_on:
      - backend

  # Gateway de API (Sesion 3, ver gateway/nginx.conf): punto de entrada
  # unico opcional en :8888, aditivo al acceso directo de arriba. No hace
  # falta para desarrollar dia a dia (seguis usando :8000/:8080), pero
  # existe para poder probar localmente el mismo patron de enrutamiento
  # que se va a necesitar en el despliegue de la Sesion 14.
  gateway:
    image: nginx:alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8888:80"
    depends_on:
      - backend
      - frontend
