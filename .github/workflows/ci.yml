name: CI

# Corre en cada push y PR hacia dev/Juanjo o main (Sesión 13: antes solo
# PRs hacia main). Nada llega a main sin que esto pase en verde — ver
# CONSTRAINTS.md, política de bloqueo sin excepciones.
on:
  push:
    branches: [dev/Juanjo, main]
  pull_request:
    branches: [main, dev/Juanjo]

# Sesión 5 (auditoría cyber-neo): permisos mínimos — ningún job escribe.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests + cobertura)
    runs-on: ubuntu-latest
    # Postgres y Redis reales (Sesión 4), no mockeados — "un mock que pasa
    # mientras producción falla es peor que no tener test" (CONSTRAINTS.md).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: healthguide
          POSTGRES_PASSWORD: healthguide_dev_only
          POSTGRES_DB: healthguide
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U healthguide -d healthguide"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://healthguide:healthguide_dev_only@localhost:5433/healthguide"
      REDIS_URL: "redis://localhost:6379/0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check backend evals
      - name: Migraciones (idempotentes)
        working-directory: backend
        run: python -m alembic upgrade head && python -m alembic upgrade head
      - name: Tests + cobertura (ratchet ≥ 92%)
        # Los tests usan StubOrchestrator: nunca llaman a NVIDIA de verdad,
        # no necesitan secrets ni gastan cuota en cada push.
        run: python -m pytest backend/tests -q --cov=backend/app --cov-report=term-missing --cov-fail-under=92

  frontend:
    name: Frontend (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests unitarios + cobertura (umbrales en vitest.config.ts)
        run: npm run test:coverage
      - name: Build de producción
        run: npm run build

  docker-build:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build imagen backend
        run: docker build -f backend/Dockerfile -t healthguideai-backend .
      - name: Build imagen frontend
        run: docker build -f frontend/Dockerfile -t healthguideai-frontend frontend
