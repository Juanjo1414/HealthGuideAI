name: CI

# Se corre en cada push a dev/Juanjo y en cada PR hacia main — la idea es
# que nadie (ni nosotros mismos) pueda fusionar a main sin que esto pase en
# verde. Ver DECISION_LOG.md y README.md para el porque de la regla de no
# tocar main sin verificar.
on:
  push:
    branches: [dev/Juanjo]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    # Postgres y Redis reales (Sesion 4), no mockeados — los tests de
    # storage/rate limiting corren contra la misma clase que usa produccion
    # (ver CONSTRAINTS.md: "un mock que pasa mientras produccion falla es
    # peor que no tener test"). Contenedores efimeros del propio job, se
    # tiran al terminar — no es el Postgres/Redis de compose.yml.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: healthguide
          POSTGRES_PASSWORD: healthguide_dev_only
          POSTGRES_DB: healthguide
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U healthguide -d healthguide"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://healthguide:healthguide_dev_only@localhost:5433/healthguide"
      REDIS_URL: "redis://localhost:6379/0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Correr migraciones
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Correr tests
        # Los tests de orquestacion usan un StubOrchestrator (ver
        # backend/tests/test_api.py) — nunca llaman a NVIDIA de verdad, asi
        # que esto no necesita secrets ni cuesta dinero en cada push.
        run: python -m pytest backend/tests -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Build de produccion
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build imagen backend
        run: docker build -f backend/Dockerfile -t healthguideai-backend .
      - name: Build imagen frontend
        run: docker build -f frontend/Dockerfile -t healthguideai-frontend frontend
