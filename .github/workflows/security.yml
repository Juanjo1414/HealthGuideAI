name: Security

# Sesión 13: lo que en la Sesión 5 se corrió a mano pasa a correr solo.
# CONSTRAINTS.md: nada en severidad high o superior, ningún secreto en el código.
on:
  push:
    branches: [dev/Juanjo, main]
  pull_request:
    branches: [main, dev/Juanjo]
  schedule:
    - cron: "0 6 * * 1" # lunes 06:00 UTC: CVEs nuevos aparecen sin que cambie el código

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      # Repo privado sin GitHub Advanced Security: no se puede subir a Code Scanning,
      # así que el SARIF queda como artefacto y el gate lo aplica el paso siguiente.
      - uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: codeql-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-${{ matrix.language }}
          path: codeql-results
      - name: Fallar si hay hallazgos de severidad error
        run: |
          total=0
          for f in codeql-results/*.sarif; do
            n=$(jq '[.runs[].results[]? | select(.level == "error")] | length' "$f")
            echo "$f: $n hallazgos nivel error"
            total=$((total + n))
          done
          test "$total" -eq 0

  dependencias:
    name: Dependencias (pip-audit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: pip-audit (backend)
        run: pip install "pip-audit>=2.7,<3" && pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: npm audit (frontend, severidad high o superior)
        working-directory: frontend
        run: npm audit --audit-level=high

  secretos:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
