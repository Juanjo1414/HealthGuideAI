server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sin esto, un navegador puede quedarse con un index.html viejo en cache
    # heuristica (sin Cache-Control, Chrome/Firefox igual cachean) — paso
    # real: se agrego login, se reconstruyo la imagen, y en el navegador
    # seguia apareciendo el dashboard directo porque nunca revalidaba el
    # index.html contra el servidor. index.html siempre se revalida (no-cache
    # obliga un GET condicional), mientras que los assets con hash en el
    # nombre (Vite los versiona) se cachean agresivo porque un cambio de
    # contenido siempre es un nombre de archivo distinto.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: hoy la app es una sola pagina sin rutas propias, pero
    # esto evita un 404 si en el futuro se agrega ruteo del lado del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
