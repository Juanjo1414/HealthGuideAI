# API Gateway (Sesion 3): un punto de entrada delante del backend, en el
# sentido real de gateway (no es solo un proxy de archivos estaticos como
# frontend/nginx.conf, que sigue existiendo tal cual). Aditivo — no
# reemplaza el acceso directo a :8000/:8080 que el equipo ya usa para
# debuggear, corre en :8888 en paralelo.
#
# Honesto sobre que tan "single origin" es esto HOY: el bundle del
# frontend sigue llamando a `VITE_API_BASE_URL` (hardcodeado en build time
# a http://localhost:8000/api, ver compose.yml) — entrar por :8888 no hace
# que el navegador use este gateway para las llamadas a la API todavia.
# Ese cableado (frontend y backend bajo el mismo origen de verdad, sin el
# que las cookies `Secure` no viajan) es trabajo de la Sesion 14, cuando
# haya un dominio real. Lo que esta sesion deja construido y probado es la
# pieza de infraestructura en si: el gateway enruta /api, /health y /ready
# al backend, y todo lo demas al frontend, correctamente.

server {
    listen 80;
    server_name _;

    # /health y /ready son de infraestructura (routes_health.py), no
    # llevan prefijo /api — ver ese archivo para el porque.
    location = /health {
        proxy_pass http://backend:8000/health;
    }

    location = /ready {
        proxy_pass http://backend:8000/ready;
    }

    # /api/v1/* y /api/* (legado, ver main.py) van al backend tal cual.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todo lo demas (la SPA) va al contenedor del frontend.
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $http_host;
    }
}
